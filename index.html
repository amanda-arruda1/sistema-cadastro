<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap');
  :root {
    --ink:#1f2622; --paper:#f6f4ee; --line:#d8d3c6;
    --moss:#3f5a4d; --moss-dark:#2c4137; --clay:#b5654a; --muted:#7a7568;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; display:flex; justify-content:center; padding:40px 20px; }
  .wrap { max-width: 480px; width:100%; }
  .eyebrow { font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--moss); font-weight:600; margin-bottom:8px; }
  h1 { font-family:'Fraunces',serif; font-size:28px; font-weight:600; margin:0 0 6px; letter-spacing:-0.01em; }
  p.sub { color:var(--muted); font-size:14px; margin:0 0 28px; }
  .card { background:white; border:1px solid var(--line); border-radius:10px; padding:24px; }
  label { display:block; font-size:13px; font-weight:500; margin-bottom:6px; }
  .field { margin-bottom:16px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:7px; font-family:'Inter',sans-serif; font-size:14px; background:var(--paper); color:var(--ink); }
  input:focus { outline:2px solid var(--moss); outline-offset:1px; background:white; }
  .error { font-size:12px; color:var(--clay); margin-top:4px; min-height:14px; }
  button { font-family:'Inter',sans-serif; font-weight:600; font-size:14px; border-radius:7px; border:none; padding:12px 18px; cursor:pointer; background:var(--moss); color:white; width:100%; }
  button:hover { background:var(--moss-dark); }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .success { display:none; text-align:center; padding:32px 12px; }
  .success strong { display:block; font-family:'Fraunces',serif; font-size:20px; margin-bottom:6px; }
  .success p { color:var(--muted); font-size:14px; margin:0; }
  .note { font-size:12px; color:var(--muted); margin-top:16px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Cadastro</div>
  <h1>Preencha seus dados</h1>
  <p class="sub">Suas informações são enviadas de forma segura e não ficam visíveis para outros usuários.</p>

  <div class="card">
    <form id="form">
      <div class="field">
        <label for="nome">Nome completo</label>
        <input id="nome" type="text" placeholder="Seu nome completo">
        <div class="error" id="err-nome"></div>
      </div>
      <div class="field">
        <label for="cpf">CPF</label>
        <input id="cpf" type="text" placeholder="000.000.000-00">
        <div class="error" id="err-cpf"></div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="nome@email.com">
        <div class="error" id="err-email"></div>
      </div>
      <div class="field">
        <label for="telefone">Telefone</label>
        <input id="telefone" type="tel" placeholder="(00) 00000-0000">
        <div class="error" id="err-telefone"></div>
      </div>
      <div class="field">
        <label for="endereco">Endereço</label>
        <input id="endereco" type="text" placeholder="Rua, número, cidade">
        <div class="error" id="err-endereco"></div>
      </div>
      <button type="submit" id="btnSubmit">Enviar cadastro</button>
    </form>

    <div class="success" id="success">
      <strong>Cadastro enviado</strong>
      <p>Recebemos suas informações com sucesso.</p>
    </div>
  </div>
  <div class="note">Seus dados são protegidos e só podem ser acessados pelo administrador do sistema.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function onlyDigits(s) { return s.replace(/\D/g, ''); }

function validarCPF(cpf) {
  cpf = onlyDigits(cpf);
  if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
  let soma = 0;
  for (let i = 0; i < 9; i++) soma += parseInt(cpf[i]) * (10 - i);
  let resto = (soma * 10) % 11;
  if (resto === 10 || resto === 11) resto = 0;
  if (resto !== parseInt(cpf[9])) return false;
  soma = 0;
  for (let i = 0; i < 10; i++) soma += parseInt(cpf[i]) * (11 - i);
  resto = (soma * 10) % 11;
  if (resto === 10 || resto === 11) resto = 0;
  return resto === parseInt(cpf[10]);
}

document.getElementById('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  let ok = true;
  const nome = document.getElementById('nome').value.trim();
  const cpf = document.getElementById('cpf').value.trim();
  const email = document.getElementById('email').value.trim();
  const telefone = document.getElementById('telefone').value.trim();
  const endereco = document.getElementById('endereco').value.trim();

  ['nome','cpf','email','telefone','endereco'].forEach(f => document.getElementById('err-'+f).textContent = '');

  if (!nome) { document.getElementById('err-nome').textContent = 'Informe o nome.'; ok = false; }
  if (!validarCPF(cpf)) { document.getElementById('err-cpf').textContent = 'CPF inválido.'; ok = false; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { document.getElementById('err-email').textContent = 'Email inválido.'; ok = false; }
  if (!telefone) { document.getElementById('err-telefone').textContent = 'Informe o telefone.'; ok = false; }
  if (!endereco) { document.getElementById('err-endereco').textContent = 'Informe o endereço.'; ok = false; }

  if (!ok) return;

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const { error } = await sb.from('cadastros').insert([{ nome, cpf, email, telefone, endereco }]);

  if (error) {
    btn.disabled = false;
    btn.textContent = 'Enviar cadastro';
    alert('Não foi possível enviar. Tente novamente em instantes.');
    console.error(error);
    return;
  }

  document.getElementById('form').style.display = 'none';
  document.getElementById('success').style.display = 'block';
});
</script>
</body>
</html>
