<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do administrador</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap');
  :root {
    --ink:#1f2622; --paper:#f6f4ee; --line:#d8d3c6;
    --moss:#3f5a4d; --moss-dark:#2c4137; --clay:#b5654a; --muted:#7a7568;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; padding:40px 20px 80px; }
  .wrap { max-width: 760px; margin:0 auto; }
  .eyebrow { font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--moss); font-weight:600; margin-bottom:8px; }
  h1 { font-family:'Fraunces',serif; font-size:28px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  .card { background:white; border:1px solid var(--line); border-radius:10px; padding:24px; margin-top:24px; }
  label { display:block; font-size:13px; font-weight:500; margin-bottom:6px; }
  .field { margin-bottom:16px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:7px; font-family:'Inter',sans-serif; font-size:14px; background:var(--paper); color:var(--ink); }
  input:focus { outline:2px solid var(--moss); outline-offset:1px; background:white; }
  button { font-family:'Inter',sans-serif; font-weight:600; font-size:14px; border-radius:7px; border:none; padding:11px 18px; cursor:pointer; }
  .btn-primary { background:var(--moss); color:white; width:100%; }
  .btn-primary:hover { background:var(--moss-dark); }
  .btn-ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn-ghost:hover { border-color:var(--moss); color:var(--moss); }
  .error { font-size:13px; color:var(--clay); margin-top:10px; min-height:14px; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:9px 8px; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:none; }
  .empty { text-align:center; padding:32px 12px; color:var(--muted); font-size:14px; }
  .row-del button { background:transparent; color:var(--muted); padding:4px 8px; font-size:12px; }
  .row-del button:hover { color:var(--clay); }
  #adminBox { display:none; }
  .table-wrap { overflow-x:auto; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Área restrita</div>
  <h1>Painel do administrador</h1>

  <div class="card" id="loginBox">
    <div class="field">
      <label for="loginEmail">Email do administrador</label>
      <input id="loginEmail" type="email" placeholder="admin@seudominio.com">
    </div>
    <div class="field">
      <label for="loginSenha">Senha</label>
      <input id="loginSenha" type="password" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="btnLogin">Entrar</button>
    <div class="error" id="loginErr"></div>
  </div>

  <div id="adminBox">
    <div class="card">
      <div class="toolbar">
        <div id="countInfo" style="font-size:14px; color:var(--muted);"></div>
        <div style="display:flex; gap:10px;">
          <button class="btn-ghost" id="btnExport">Exportar CSV</button>
          <button class="btn-ghost" id="btnLogout">Sair</button>
        </div>
      </div>
      <div class="table-wrap" id="listArea"><div class="empty">carregando...</div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let cadastros = [];

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function checkSession() {
  const { data } = await supabase.auth.getSession();
  if (data.session) {
    showAdmin();
  }
}

async function showAdmin() {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('adminBox').style.display = 'block';
  await loadCadastros();
}

document.getElementById('btnLogin').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  document.getElementById('loginErr').textContent = '';

  const { error } = await supabase.auth.signInWithPassword({ email, password: senha });
  if (error) {
    document.getElementById('loginErr').textContent = 'Email ou senha incorretos.';
    return;
  }
  await showAdmin();
});

document.getElementById('btnLogout').addEventListener('click', async () => {
  await supabase.auth.signOut();
  location.reload();
});

async function loadCadastros() {
  const { data, error } = await supabase
    .from('cadastros')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    document.getElementById('listArea').innerHTML = '<div class="empty">Erro ao carregar os cadastros.</div>';
    return;
  }
  cadastros = data;
  render();
}

function render() {
  document.getElementById('countInfo').textContent =
    cadastros.length === 0 ? 'Nenhum cadastro ainda' :
    cadastros.length === 1 ? '1 cadastro' : cadastros.length + ' cadastros';

  const area = document.getElementById('listArea');
  if (cadastros.length === 0) {
    area.innerHTML = '<div class="empty">Nenhum cadastro recebido ainda.</div>';
    return;
  }

  let html = '<table><thead><tr><th>Nome</th><th>CPF</th><th>Email</th><th>Telefone</th><th>Endereço</th><th>Data</th><th></th></tr></thead><tbody>';
  cadastros.forEach(c => {
    const data = new Date(c.created_at).toLocaleString('pt-BR');
    html += `<tr>
      <td>${escapeHtml(c.nome)}</td>
      <td>${escapeHtml(c.cpf)}</td>
      <td>${escapeHtml(c.email)}</td>
      <td>${escapeHtml(c.telefone)}</td>
      <td>${escapeHtml(c.endereco)}</td>
      <td>${data}</td>
      <td class="row-del"><button data-id="${c.id}" class="del-btn">Remover</button></td>
    </tr>`;
  });
  html += '</tbody></table>';
  area.innerHTML = html;

  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Remover este cadastro definitivamente?')) return;
      const id = btn.getAttribute('data-id');
      await supabase.from('cadastros').delete().eq('id', id);
      await loadCadastros();
    });
  });
}

document.getElementById('btnExport').addEventListener('click', () => {
  if (cadastros.length === 0) return;
  const header = ['Nome','CPF','Email','Telefone','Endereço','Data'];
  const rows = cadastros.map(c => [c.nome, c.cpf, c.email, c.telefone, c.endereco, new Date(c.created_at).toLocaleString('pt-BR')]);
  const csvLines = [header, ...rows].map(r => r.map(f => `"${String(f).replace(/"/g,'""')}"`).join(','));
  const csvContent = '\uFEFF' + csvLines.join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'cadastros.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

checkSession();
</script>
</body>
</html>
